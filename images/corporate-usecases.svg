  <text x="277" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#BCA402" font-weight="700">Zone A · Accès Complet</text>
  <text x="60" y="178" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#1A1A0F">Conférences &amp;</text>
  <text x="60" y="198" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#BCA402">Sommets</text>
  <text x="60" y="220" font-family="sans-serif" font-size="11" fill="#AAA">Accréditations multi-catégories</text>

  <!-- Card 2: Séminaires (dark) -->
  <rect x="430" y="0" width="420" height="240" rx="14" fill="#1A1A0F" filter="url(#sh)"/>
