  <!-- Champagne glasses -->
  <path d="M946 55 L952 82 L948 86 L948 100 L940 104 L958 104" fill="none" stroke="#BCA402" stroke-width="2" stroke-linejoin="round"/>
  <path d="M952 82 Q948 86 946 55" fill="rgba(188,164,2,0.15)"/>
  <path d="M974 55 L968 82 L972 86 L972 100 L964 104 L982 104" fill="none" stroke="#BCA402" stroke-width="2" stroke-linejoin="round"/>
  <path d="M968 82 Q972 86 974 55" fill="rgba(188,164,2,0.15)"/>
  <!-- Bubbles -->
  <circle cx="949" cy="70" r="1.5" fill="#BCA402" opacity="0.5"/>
  <circle cx="952" cy="62" r="1" fill="#BCA402" opacity="0.4"/>
  <circle cx="971" cy="67" r="1.5" fill="#BCA402" opacity="0.5"/>
  <text x="940" y="50" font-family="sans-serif" font-size="10" fill="#BCA402" opacity="0.5">✦</text>
  <text x="992" y="48" font-family="sans-serif" font-size="14" fill="#BCA402" opacity="0.4">✦</text>
  <!-- VIP ticket -->
  <rect x="1020" y="58" width="240" height="74" rx="10" fill="#1A1A0F"/>
  <rect x="1020" y="58" width="240" height="4" rx="10" fill="#BCA402"/>
  <text x="1140" y="84" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" letter-spacing="2">GALA ANNUEL · TABLE VIP</text>
  <text x="1140" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#BCA402" font-weight="700">Zone Premium · Dîner inclus</text>
  <text x="930" y="178" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#1A1A0F">Galas &amp;</text>
  <text x="930" y="198" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#BCA402">Soirées Corporate</text>
  <text x="930" y="220" font-family="sans-serif" font-size="11" fill="#AAA">Expérience premium pour vos invités</text>
