  <circle cx="58" cy="116" r="4" fill="#BCA402" opacity="0.6"/>
  <circle cx="70" cy="116" r="4" fill="#BCA402" opacity="0.5"/>
  <circle cx="82" cy="116" r="4" fill="#BCA402" opacity="0.7"/>
  <circle cx="94" cy="116" r="4" fill="#BCA402" opacity="0.4"/>
  <circle cx="106" cy="116" r="4" fill="#BCA402" opacity="0.6"/>
  <!-- Badge VIP -->
