  <rect x="498" y="64" width="64" height="48" rx="5" fill="white" stroke="rgba(188,164,2,0.3)" stroke-width="1"/>
  <line x1="506" y1="76" x2="554" y2="76" stroke="#BCA402" stroke-width="2" stroke-linecap="round"/>
  <line x1="506" y1="84" x2="548" y2="84" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="506" y1="91" x2="550" y2="91" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="506" y1="98" x2="544" y2="98" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="508" y="86" font-family="sans-serif" font-size="8" fill="#4CAF50">✓</text>
  <text x="508" y="94" font-family="sans-serif" font-size="8" fill="#BCA402">✓</text>
