  <!-- Stage + speaker silhouette -->
  <rect x="54" y="98" width="72" height="30" rx="3" fill="#1A1A0F"/>
  <rect x="54" y="98" width="72" height="3" fill="#BCA402"/>
  <circle cx="90" cy="87" r="8" fill="#F0E8A0"/>
  <circle cx="90" cy="80" r="4" fill="#C4A832"/>
  <path d="M83 95 Q90 91 97 95" fill="#C4A832"/>
  <rect x="86" y="95" width="8" height="4" rx="1" fill="#2A2A1A"/>
