<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="rgba(0,0,0,0.08)"/></filter>
  </defs>
  <!-- Card 1: Conférences -->
  <rect x="0" y="0" width="420" height="240" rx="14" fill="white" filter="url(#sh)"/>
