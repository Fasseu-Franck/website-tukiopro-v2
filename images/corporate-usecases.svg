  <text x="710" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#BCA402">24/30</text>
  <text x="710" y="126" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Inscrits confirmés</text>
  <text x="440" y="180" font-family="Georgia,serif" font-size="15" font-weight="700" fill="white">  Séminaires &amp;</text>
  <text x="440" y="200" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#BCA402">  Formations</text>
  <text x="440" y="220" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">  Inscriptions ciblées par équipe</text>

