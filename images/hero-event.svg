<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF0"/>
      <stop offset="100%" stop-color="#F5EEC0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BCA402"/>
      <stop offset="100%" stop-color="#8A7600"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>
  <rect width="600" height="520" fill="url(#bg)" rx="20"/>

  <!-- Decorative circles -->
  <circle cx="540" cy="60" r="80" fill="rgba(188,164,2,0.07)"/>
  <circle cx="560" cy="80" r="50" fill="rgba(188,164,2,0.10)"/>
  <circle cx="60" cy="460" r="60" fill="rgba(188,164,2,0.06)"/>

  <!-- Main event card -->
  <rect x="32" y="40" width="340" height="210" rx="14" fill="white" filter="url(#shadow)"/>
  <rect x="32" y="40" width="340" height="7" rx="14" fill="url(#gold)"/>

  <text x="52" y="82" font-family="Georgia,serif" font-size="10" fill="#BCA402" letter-spacing="2" font-weight="700">TUKIO PRO · ÉVÉNEMENT LIVE</text>
  <text x="52" y="112" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#1A1A0F">Africa Tech Summit 2025</text>
  <text x="52" y="134" font-family="sans-serif" font-size="12" fill="#AAA">Conférence internationale · Abidjan</text>

  <!-- Progress bar -->
  <rect x="52" y="158" width="300" height="7" rx="3.5" fill="#F0EDE0"/>
  <rect x="52" y="158" width="210" height="7" rx="3.5" fill="url(#gold)"/>
  <text x="52" y="184" font-family="sans-serif" font-size="11" fill="#BCA402" font-weight="700">847 billets vendus</text>
  <text x="310" y="184" font-family="sans-serif" font-size="11" fill="#CCC">sur 1 200</text>

  <rect x="52" y="198" width="80" height="26" rx="5" fill="rgba(188,164,2,0.12)"/>
  <text x="92" y="216" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BCA402" font-weight="700">● LIVE</text>
  <rect x="144" y="198" width="110" height="26" rx="5" fill="#F8F6F0"/>
  <text x="199" y="216" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888">14 Juin · 09h00</text>

  <!-- Stat mini cards row -->
  <rect x="32" y="272" width="100" height="76" rx="10" fill="white" filter="url(#shadow-sm)"/>
  <text x="82" y="301" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#BCA402">98%</text>
  <text x="82" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">Satisfaction</text>
  <text x="82" y="336" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CCC">Organisateurs</text>

  <rect x="146" y="272" width="100" height="76" rx="10" fill="url(#gold)" filter="url(#shadow-sm)"/>
  <text x="196" y="301" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="white">2.4K</text>
  <text x="196" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Événements</text>
  <text x="196" y="336" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Créés</text>

  <rect x="260" y="272" width="100" height="76" rx="10" fill="white" filter="url(#shadow-sm)"/>
  <text x="310" y="301" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#1A1A0F">40+</text>
  <text x="310" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">Pays</text>
  <text x="310" y="336" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#CCC">Connectés</text>

  <!-- Floating dark badge top-right -->
  <rect x="376" y="48" width="192" height="62" rx="12" fill="#1A1A0F" filter="url(#shadow)"/>
  <circle cx="400" cy="79" r="9" fill="#4CAF50"/>
  <text x="400" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white" font-weight="700">✓</text>
  <text x="420" y="73" font-family="sans-serif" font-size="12" fill="white" font-weight="600">Vote en cours</text>
  <text x="420" y="91" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.45)">3 847 votes reçus</text>

  <!-- People avatars -->
  <circle cx="400" cy="180" r="26" fill="#F0E8A0"/>
  <circle cx="400" cy="165" r="11" fill="#C4A832"/>
  <path d="M380 206 Q400 196 420 206" fill="#C4A832"/>

  <circle cx="450" cy="172" r="26" fill="#E8D880"/>
  <circle cx="450" cy="157" r="11" fill="#AE9228"/>
  <path d="M430 198 Q450 188 470 198" fill="#AE9228"/>

  <circle cx="500" cy="178" r="26" fill="#F5ECC0"/>
  <circle cx="500" cy="163" r="11" fill="#D4B840"/>
  <path d="M480 204 Q500 194 520 204" fill="#D4B840"/>

  <!-- QR Code card -->
  <rect x="376" y="270" width="100" height="100" rx="10" fill="white" filter="url(#shadow-sm)"/>
  <rect x="388" y="282" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="402" y="282" width="10" height="10" fill="#BCA402" rx="1"/>
  <rect x="416" y="282" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="430" y="282" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="458" y="282" width="10" height="10" fill="#BCA402" rx="1"/>
  <rect x="388" y="296" width="10" height="10" fill="#BCA402" rx="1"/>
  <rect x="416" y="296" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="444" y="296" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="388" y="310" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="402" y="310" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="430" y="310" width="10" height="10" fill="#BCA402" rx="1"/>
  <rect x="458" y="310" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="388" y="324" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="416" y="324" width="10" height="10" fill="#BCA402" rx="1"/>
  <rect x="444" y="324" width="10" height="10" fill="#1A1A0F" rx="1"/>
  <rect x="458" y="324" width="10" height="10" fill="#BCA402" rx="1"/>
  <text x="426" y="358" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#AAA">Scan pour voter</text>

  <!-- Revenue card -->
  <rect x="486" y="270" width="100" height="100" rx="10" fill="#1A1A0F" filter="url(#shadow)"/>
  <text x="536" y="302" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="1">REVENUS</text>
  <text x="536" y="328" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#BCA402">1.9M</text>
  <text x="536" y="346" text-anchor="middle" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">FCFA collectés</text>

  <!-- Bottom wave decoration -->
  <ellipse cx="300" cy="510" rx="240" ry="18" fill="rgba(188,164,2,0.07)"/>
</svg>
