<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>
  <rect width="560" height="400" fill="#FDFAF8" rx="16"/>

  <!-- Problem tools (top row) -->
  <rect x="20" y="30" width="155" height="90" rx="10" fill="white" filter="url(#sh)"/>
  <rect x="20" y="30" width="155" height="5" rx="10" fill="#E05050"/>
  <!-- Chat icon -->
  <rect x="44" y="52" width="32" height="28" rx="6" fill="#F5F0F0" stroke="#E0D0D0" stroke-width="1.5"/>
  <path d="M48 66 L54 66 M48 72 L68 72" stroke="#CCC" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 80 L38 88 L52 80" fill="#F5F0F0" stroke="#E0D0D0" stroke-width="1"/>
  <text x="118" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#888">WhatsApp</text>
  <text x="118" y="76" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BBB">Invitations</text>
  <text x="118" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CCC">manuelles</text>

  <rect x="193" y="30" width="155" height="90" rx="10" fill="white" filter="url(#sh)"/>
  <rect x="193" y="30" width="155" height="5" rx="10" fill="#E05050"/>
  <!-- Spreadsheet icon -->
  <rect x="213" y="52" width="32" height="28" rx="4" fill="#F0F5F0" stroke="#C0D0C0" stroke-width="1.5"/>
  <line x1="213" y1="62" x2="245" y2="62" stroke="#C0D0C0" stroke-width="1"/>
  <line x1="213" y1="70" x2="245" y2="70" stroke="#C0D0C0" stroke-width="1"/>
  <line x1="227" y1="52" x2="227" y2="80" stroke="#C0D0C0" stroke-width="1"/>
  <text x="291" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#888">Excel &amp; Papier</text>
  <text x="291" y="76" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BBB">Gestion invités</text>
  <text x="291" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CCC">non tracée</text>

  <rect x="366" y="30" width="174" height="90" rx="10" fill="white" filter="url(#sh)"/>
  <rect x="366" y="30" width="174" height="5" rx="10" fill="#E05050"/>
  <!-- Phone icon -->
  <rect x="384" y="50" width="22" height="32" rx="5" fill="#F0F0F5" stroke="#D0D0E0" stroke-width="1.5"/>
  <rect x="387" y="54" width="16" height="20" rx="2" fill="#E8E8F0"/>
  <circle cx="395" cy="78" r="2" fill="#C0C0D0"/>
  <text x="462" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#888">Mobile Money</text>
  <text x="462" y="76" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BBB">Paiements</text>
  <text x="462" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#CCC">non tracés</text>

  <!-- Arrow down -->
  <line x1="280" y1="130" x2="280" y2="162" stroke="#E0D8C8" stroke-width="2"/>
  <polygon points="274,158 280,172 286,158" fill="#E0D8C8"/>

  <!-- Problem card -->
  <rect x="60" y="178" width="440" height="80" rx="12" fill="#FFF5F5" filter="url(#sh)"/>
  <rect x="60" y="178" width="440" height="5" rx="12" fill="#E05050" opacity="0.4"/>
  <!-- Warning icon -->
  <polygon points="96,200 80,228 112,228" fill="none" stroke="#E05050" stroke-width="2" opacity="0.5"/>
  <text x="96" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E05050" opacity="0.7">!</text>
  <text x="128" y="208" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#C04040">Résultat : chaos, erreurs, argent non tracé</text>
  <text x="128" y="228" font-family="sans-serif" font-size="11" fill="#AAA">Aucune visibilité · Expérience dégradée pour vos invités</text>
  <text x="128" y="245" font-family="sans-serif" font-size="11" fill="#BBB">Zéro données exploitables après l'événement</text>

  <!-- Arrow down gold -->
  <line x1="280" y1="268" x2="280" y2="300" stroke="#BCA402" stroke-width="2"/>
  <polygon points="274,296 280,310 286,296" fill="#BCA402"/>

  <!-- Solution card -->
  <rect x="60" y="316" width="440" height="66" rx="12" fill="#BCA402" filter="url(#sh)"/>
  <!-- T logo -->
  <rect x="80" y="333" width="30" height="30" rx="6" fill="rgba(0,0,0,0.15)"/>
  <text x="95" y="354" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="white">T</text>
  <text x="280" y="342" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#1A1A0F">TUKIO PRO centralise tout en une seule plateforme</text>
  <text x="280" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(0,0,0,0.55)">Vote · Collecte · Billetterie Corporate · Événements Privés</text>
</svg>
