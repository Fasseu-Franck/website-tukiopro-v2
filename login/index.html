<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — TUKIO PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="../images/Logotukio.svg" />
  </head>
  <body>
    <div class="login-container reveal">
      <a href="../index.html" class="login-logo">
        <img src="../images/Logotukio.svg" alt="TUKIO PRO" />
        <span>TUKIO <em>PRO</em></span>
      </a>
      <div class="login-header">
        <h1 class="login-title-text">Connexion</h1>
        <p class="login-subtitle">Connectez-vous pour accéder à votre compte</p>
      </div>
      <form action="#" method="POST" id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="bryan@tukio.net"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••••••••••"
            required
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Afficher le mot de passe"
            id="togglePassword"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <line x1="3" y1="3" x2="21" y2="21"></line>
            </svg>
          </button>
        </div>
        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" />
            Se souvenir de moi
          </label>
          <a href="#" class="forgot-password">Mot de passe oublié</a>
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>
      <a href="../index.html" class="back-home">Retour à l'accueil</a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
